name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  # Layer 3 (compose-integration) is heavy (Docker build + multi-container bring-up), so it is
  # NOT on the per-push fast path — it runs on manual dispatch, nightly, or a PR labelled ci:compose.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC

permissions:
  contents: read

jobs:
  backend:
    name: Backend format, compile, and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Install build toolchain (cmake for brod/crc32cer NIF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            apps/backend/deps
            apps/backend/_build
          key: ${{ runner.os }}-backend-mix-${{ hashFiles('apps/backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

  # Layer 2: locks the DISTRIBUTED/DB behavior into CI without touching the fast gate above.
  # Runs the already-existing postgres_integration (323) + http_integration (the 5 HTTP client
  # adapters' real-localhost round-trips) tags against a Postgres service container. Parallel to
  # `backend`; never blocks the quick Docker-free signal. (Compose/network differential = Layer 3,
  # a later label/nightly-gated job — NOT here.)
  integration:
    name: Integration (postgres_integration + http_integration)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat_user
          POSTGRES_PASSWORD: chat_password
          POSTGRES_DB: chat_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_user -d chat_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # config/test.exs reads these to point the Repos at the service container (still :test, so the
    # placeholder secrets are fine — no prod guard on this path).
    env:
      POSTGRES_TEST_HOST: localhost
      POSTGRES_TEST_PORT: "5432"
      POSTGRES_TEST_USER: chat_user
      POSTGRES_TEST_PASSWORD: chat_password
      POSTGRES_TEST_DATABASE: chat_platform_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Install build toolchain (cmake for brod/crc32cer NIF) + psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential postgresql-client

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            apps/backend/deps
            apps/backend/_build
          key: ${{ runner.os }}-backend-mix-${{ hashFiles('apps/backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-mix-

      - name: Install dependencies
        run: mix deps.get

      # Deliberately NOT --warnings-as-errors here: the fast `backend` job above already owns the lint
      # gate. Both jobs previously used it, and a single pre-existing warning failed COMPILE in this
      # job — so the postgres tests below never executed on any push, for months, while the run showed
      # red and the red became normal. A lint regression must not be able to hide a DB regression.
      - name: Compile
        run: mix compile

      # Schema load + per-suite execution live in scripts/test-postgres.sh, which is ALSO what a human
      # runs before deploying. Invoked, not restated: a re-implementation here is exactly the drift
      # that let "runs in your CI" stay believable while nothing ran.
      - name: Postgres suites (scripts/test-postgres.sh)
        working-directory: ${{ github.workspace }}
        run: ./scripts/test-postgres.sh

      # http_integration is a separate tag (the 5 HTTP client adapters' real-localhost round-trips) and
      # needs no database, so it stays a plain umbrella run rather than going through the script.
      - name: Test (http_integration)
        run: mix test --include http_integration

  # Layer 3: the REAL distributed-failure proof — brings up docker-compose.prod.yml (gateway +
  # services as separate containers, gateway flipped to HTTP adapters) and runs the gateway→auth
  # 401/503/recovery differential over the network. GATED (NOT on the per-push fast path): runs only
  # on manual dispatch, the nightly schedule, or a PR explicitly labelled `ci:compose`. Does NOT
  # touch the `backend` or `integration` jobs.
  compose-integration:
    name: Compose integration (gateway→auth 401/503/recover differential)
    runs-on: ubuntu-latest
    # Fail-fast on a hung cold build (6 images); the differential script keeps READY_TIMEOUT=90.
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:compose'))

    # Dummy non-placeholder secrets so config/runtime.exs's prod guard passes (these only satisfy the
    # guard; nothing real). compose interpolates them into docker-compose.prod.yml's x-secrets.
    env:
      SECRET_KEY_BASE: ci_compose_secret_key_base_0123456789abcdef0123456789abcdef
      TOKEN_SECRET: ci_compose_token_secret_0123456789abcdef
      OTP_SECRET: ci_compose_otp_secret_0123456789abcdef
      INTERNAL_API_TOKEN: ci_compose_internal_token_0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships Docker + Compose v2. Build images + bring the stack up; --wait blocks
      # until postgres is healthy and the rest are running (the differential script then waits for
      # the gateway's /health + the gateway→auth path before asserting).
      - name: Build + start the prod-shaped stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Distributed-failure differential (401 / 503 / recovery)
        run: bash scripts/ci/compose_differential.sh

      - name: Tear down (always)
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
