name: chat-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_platform
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - chat-platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat-platform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4
    container_name: chat-platform-scylladb
    restart: unless-stopped
    command:
      - --smp
      - "1"
      - --memory
      - "750M"
      - --overprovisioned
      - "1"
      - --api-address
      - "0.0.0.0"
    ports:
      - "9042:9042"
      - "9180:9180"
      - "10000:10000"
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - chat-platform-network

  kafka:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    container_name: chat-platform-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - chat-platform-network

  # One-shot: creates the topics from topics.env with their declared partition counts
  # (e.g. message.events.v1 = 6) BEFORE producers publish, so :hash partitioning has a
  # stable partition count. Without this, AUTO_CREATE_TOPICS would create them at
  # NUM_PARTITIONS=3 on first produce. The script waits for Kafka readiness itself.
  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    container_name: chat-platform-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      TOPICS_FILE: "/topics.env"
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
      - ./kafka/topics.env:/topics.env:ro
    networks:
      - chat-platform-network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: chat-platform-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    networks:
      - chat-platform-network

  minio:
    image: minio/minio:latest
    container_name: chat-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - chat-platform-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: chat-platform-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - chat-platform-network

networks:
  chat-platform-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  kafka_data:
  minio_data:
