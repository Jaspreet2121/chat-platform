# LiveKit SFU config — Phase-1 calling (Slice 0). Mounted read-only into the livekit container.
#
# SECRETS ARE NOT HERE. The API key/secret pair comes from the LIVEKIT_KEYS env var (set from .env by
# docker-compose), so this file is safe to commit. The livekit container runs with HOST networking, so
# every port below binds the EC2 host directly (see docker-compose.prod.yml + the security-group notes).
#
# Ports:
#   7880  HTTP + WebSocket control/signaling  — fronted by Caddy → wss://livekit.growblic.com (NOT public).
#   7881  ICE/TCP fallback                    — host-published; OPEN in the security group.
#   50000-60000/udp  WebRTC media (RTP)        — host-bound; OPEN in the security group (THIS is the audio).
#   3478/udp  built-in TURN (UDP fallback)     — host-bound; OPEN in the security group.

port: 7880
log_level: info

rtc:
  # ICE/TCP fallback for clients that can't do UDP at all.
  tcp_port: 7881
  # WebRTC media (RTP) UDP range. With host networking these bind the EC2 host directly (no docker-proxy).
  port_range_start: 50000
  port_range_end: 60000
  # REQUIRED on a cloud/NAT box: advertise the EC2 PUBLIC IP (auto-detected via STUN) to clients, not the
  # private/container IP — otherwise clients send media to an unreachable address and there's no audio.
  use_external_ip: true

# Built-in TURN — restrictive-NAT fallback. Slice 0 enables UDP-only TURN on 3478 (no TLS, no cert), which
# deliberately AVOIDS the :443 clash with Caddy (see the "TURN on 443" note in the deliverable). TURN/TLS on
# 443 or 5349 is a later slice.
turn:
  enabled: true
  domain: livekit.growblic.com
  udp_port: 3478
