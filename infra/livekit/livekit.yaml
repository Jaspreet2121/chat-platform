# LiveKit SFU config — Phase-1 calling. Mounted read-only into the livekit container.
#
# SECRETS ARE NOT HERE. The API key/secret pair comes from the LIVEKIT_KEYS env var (set from .env by
# docker-compose), so this file is safe to commit.
#
# NETWORKING: the livekit container is on the `chatnet` BRIDGE (not host networking) so Caddy can reach
# the control port by SERVICE NAME (reverse_proxy livekit:7880). Media/TURN ports are published on the
# host. To avoid docker-proxy on a 10 000-port UDP range, ALL WebRTC media is muxed over a SINGLE UDP
# port (rtc.udp_port) — one published UDP port, one security-group rule.
#
# Ports (host-published in docker-compose.prod.yml unless noted):
#   7880  HTTP + WebSocket control/signaling  — INTERNAL only; Caddy reaches it as livekit:7880 (NOT public).
#   7881/tcp  ICE/TCP fallback                — published; OPEN in the security group.
#   7882/udp  WebRTC media (RTP), single mux  — published; OPEN in the security group (THIS carries the audio).
#   3478/udp  built-in TURN (UDP fallback)    — published; OPEN in the security group.

port: 7880
log_level: info

# On-demand call rooms: our rooms (`call-<id>`) are NEVER pre-created via LiveKit's server API — the first
# participant creates the room by joining with a valid join token. auto_create lets that happen; with it OFF
# (or unset, which v1.9 treats strictly), the first joiner is denied "no permission to access this room" even
# though the token grant carries roomJoin+roomCreate. This is the server-side switch that permits create-on-
# join. Key is top-level `room.auto_create` (livekit-server v1.9 config schema).
room:
  auto_create: true

rtc:
  # ICE/TCP fallback for clients that can't do UDP at all.
  tcp_port: 7881
  # SINGLE UDP media port — all participants' RTP is multiplexed over this one port (rather than a
  # 50000-60000 range), so only ONE UDP port is published/opened. This is the production-recommended setup
  # for a bridge-networked container and removes the docker-proxy large-range problem entirely.
  udp_port: 7882
  # On the BRIDGE the container can't STUN-detect the host's public IP, so advertise it explicitly. This
  # is the address clients send media to; it MUST be the EC2 public IP (change if the box/IP changes).
  use_external_ip: false
  node_ip: 13.127.78.122

# Built-in TURN — restrictive-NAT fallback. UDP on 3478 (no TLS) PLUS TURNS (TURN over TLS) on 5349. The
# :443 clash with Caddy is avoided by using 5349 for TLS; LiveKit terminates TLS ITSELF (external_tls stays
# off) using the cert Caddy obtains for turn.growblic.com and stores in the caddy_data volume (mounted
# read-only at /caddy-certs — see docker-compose.prod.yml). The cert must EXIST at boot → deploy Caddy first.
# `domain` is a SINGLE value LiveKit uses for BOTH the advertised TURN URIs and the TLS server name, so it
# must match the Caddy cert → changed from livekit.growblic.com to turn.growblic.com (turn.* resolves to the
# same IP, so UDP TURN on 3478 is unaffected). ADDITIVE: if TURN fails, calls still work via direct UDP.
turn:
  enabled: true
  domain: turn.growblic.com
  udp_port: 3478
  tls_port: 5349
  # Cert files from Caddy's storage layout ($XDG_DATA_HOME=/data → caddy/certificates/...), read-only mount.
  cert_file: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.growblic.com/turn.growblic.com.crt
  key_file: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.growblic.com/turn.growblic.com.key
