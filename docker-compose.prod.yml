# Production-shaped multi-container bring-up: each service runs as its OWN container, built from
# the parameterized apps/backend/Dockerfile (RELEASE build-arg). The gateway talks to the services
# over the compose network via the HTTP client adapters (*_CLIENT_ADAPTER=http + *_SERVICE_URL).
#
# This is the FIRST real cross-network proof of the microservices split. Core chat only — Kafka,
# Redis, Scylla and MinIO are intentionally NOT here (staged rollout; their flags stay off). They
# can be added later (the dev infra compose at infra/docker/docker-compose.yml has them).
#
#   cp .env.prod.example .env        # then fill in the secrets (see DEPLOYMENT.md runbook)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets come from a .env file in this directory (compose auto-loads it). They are NEVER baked
# into images — config/runtime.exs reads them at boot and fails fast if missing/insecure.

name: chat-platform-prod

# --- Shared env every release needs ----------------------------------------------------------
# runtime.exs (evaluated by EVERY release in :prod) requires all of these present; PHX_HOST is a
# gateway concern but is currently required for every release (documented quirk).
x-secrets: &secrets
  MIX_ENV: prod
  DATABASE_URL: postgres://chat_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/chat_platform
  DATABASE_SSL: "false"
  # Public host for URL generation. Set PHX_HOST=<server-ip-or-domain> in .env for a real server
  # (defaults to localhost for a local smoke test).
  PHX_HOST: ${PHX_HOST:-localhost}
  # Websocket origin allow-list. Empty (default) DISABLES the check_origin check — fine for a LAN/IP
  # test; set WEB_ORIGIN=https://<web-host> in .env to lock the socket down behind a proxy.
  WEB_ORIGIN: ${WEB_ORIGIN:-}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
  TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
  OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET in .env}
  # One shared token across gateway + all services — TokenPlug rejects mismatches with 401.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}

x-service-base: &service-base
  restart: unless-stopped
  networks: [chatnet]
  # RAM cap for the core Elixir/BEAM services (auth/conversation/user/message/media) on the 7.6GB box.
  # Each idles ~150MB; 384m gives headroom without letting one balloon and OOM the host.
  mem_limit: 384m
  # Services need Postgres ready before they serve DB requests.
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: chat_platform
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres auto-runs *.sql here IN FILENAME ORDER on the FIRST init of an empty volume.
      # 001..042 are already ordered → the full schema is applied before any service connects.
      # (On an already-initialized volume these are NOT re-run — see the debug loop in DEPLOYMENT.md.)
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [chatnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    <<: *service-base
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: auth_service, SERVICE_PORT: "4101"}
    environment:
      <<: *secrets
      AUTH_HTTP_API_ENABLED: "true"
      AUTH_HTTP_PORT: "4101"
      AUTH_SESSION_DB_BACKED: "true"
      # DB-backed auth (matches fly.toml). Without the OTP flags, request_otp takes the placeholder
      # branch (no persist/echo/verify) and login can't complete.
      AUTH_OTP_REQUEST_DB_BACKED: "true"
      AUTH_OTP_VERIFY_DB_BACKED: "true"
      AUTH_REFRESH_TOKEN_DB_BACKED: "true"
      AUTH_LOGOUT_DB_BACKED: "true"
      # OTP SMS delivery (SMSGatewayHub/DLT) runs HERE — auth_service owns the OTP request path; the
      # gateway proxies to auth over HTTP, so these belong on the auth container only. All from .env.
      # Provider toggle: console (default, no real SMS) | smsgatewayhub (real send). PROD must set
      # SMS_PROVIDER=smsgatewayhub + the secrets below to actually text users.
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      # Legacy flag (still honored when SMS_PROVIDER is unset: true → smsgatewayhub). Prefer SMS_PROVIDER.
      OTP_SMS_DELIVERY_ENABLED: ${OTP_SMS_DELIVERY_ENABLED:-false}
      # Local/staging convenience to obtain the OTP without SMS (echo→response, log→logs). DEFAULT none.
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-none}
      SMS_GATEWAY_HUB_API_KEY: ${SMS_GATEWAY_HUB_API_KEY:-}
      SMS_GATEWAY_HUB_SENDER_ID: ${SMS_GATEWAY_HUB_SENDER_ID:-ISOOBC}
      SMS_GATEWAY_HUB_ROUTE: ${SMS_GATEWAY_HUB_ROUTE:-}
      SMS_ENTITY_ID: ${SMS_ENTITY_ID:-}
      SMS_TEMPLATE_LOGIN_ID: ${SMS_TEMPLATE_LOGIN_ID:-}
      # OTP message body ({code} → the OTP). Leave unset to use the built-in DLT-approved default.
      SMS_OTP_TEMPLATE: ${SMS_OTP_TEMPLATE:-}
      # Send the bare 10-digit number (drop 91) when true. Default false.
      SMS_STRIP_COUNTRY_CODE: ${SMS_STRIP_COUNTRY_CODE:-false}
    expose: ["4101"]

  conversation:
    <<: *service-base
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: conversation_service, SERVICE_PORT: "4102"}
    environment:
      <<: *secrets
      CONVERSATION_HTTP_API_ENABLED: "true"
      CONVERSATION_HTTP_PORT: "4102"
      CONVERSATION_DB_BACKED: "true"
      # Publish participant_added/removed to the live broker (fire-and-forget; see message svc note).
      KAFKA_PRODUCER_ADAPTER: brod
      # Set false in .env to run WITHOUT Kafka (fanout off — see runbook); avoids publish retries when
      # the kafka service isn't started. runtime.exs honors KAFKA_BROKERS at boot (not a compile trap).
      CONVERSATION_PUBLISH_ENABLED: ${CONVERSATION_PUBLISH_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    expose: ["4102"]

  user:
    <<: *service-base
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: user_service, SERVICE_PORT: "4103"}
    environment:
      <<: *secrets
      USER_HTTP_API_ENABLED: "true"
      USER_HTTP_PORT: "4103"
      USER_PROFILE_DB_BACKED: "true"
    expose: ["4103"]

  message:
    <<: *service-base
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: message_service, SERVICE_PORT: "4104"}
    environment:
      <<: *secrets
      MESSAGE_HTTP_API_ENABLED: "true"
      MESSAGE_HTTP_PORT: "4104"
      MESSAGE_DB_BACKED: "true"
      # Explicit Postgres store for the first deploy (default QueryPlanAdapter; Scylla is later).
      MESSAGE_STORE_ADAPTER: postgres
      # Publish message.created.v1 to the live broker. BOTH are required: the adapter selects
      # BrodProducer (else NoopProducer = no-op + no client), the flag gates the produce call.
      # Producing is fire-and-forget — core message creation succeeds even if the broker is down,
      # so this stays additive and core deps (postgres only) are unchanged.
      KAFKA_PRODUCER_ADAPTER: brod
      # Set false in .env to run WITHOUT Kafka (fanout off — see runbook).
      KAFKA_PUBLISH_ENABLED: ${KAFKA_PUBLISH_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    expose: ["4104"]

  media:
    <<: *service-base
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: media_service, SERVICE_PORT: "4105"}
    environment:
      <<: *secrets
      MEDIA_HTTP_API_ENABLED: "true"
      MEDIA_HTTP_PORT: "4105"
      MEDIA_DB_BACKED: "true"
      # Max upload size (bytes), runtime-read by MediaService.Media. Default 100 MB; oversized uploads
      # are rejected with 413 media.too_large so a large video can't fill MinIO unbounded.
      MEDIA_MAX_SIZE_BYTES: ${MEDIA_MAX_SIZE_BYTES:-104857600}
      # Object storage via MinIO: the adapter generates presigned URLs against this endpoint/bucket.
      MEDIA_STORAGE_ADAPTER: minio
      # Internal endpoint for server-side ops; the browser cannot resolve "minio".
      MINIO_ENDPOINT: http://minio:9000
      # Browser-reachable endpoint used ONLY to sign presigned PUT/GET URLs, so the SigV4 host matches
      # the host the browser actually hits. MinIO's :9000 is published to the host (see the minio
      # service). Override for a real deployment (e.g. https://media.example.com).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_BUCKET: chat-media
      # Must MATCH the minio service's root creds (media authenticates to MinIO with them). From .env.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: us-east-1
      MINIO_PATH_STYLE: "true"
    expose: ["4105"]
    # Override the service-base depends_on (shallow `<<:` merge) to add minio-init: the bucket must
    # exist before media serves uploads. Keeps the postgres-healthy gate too.
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # --- Event backbone (staged-in 2026-06-24) -------------------------------------------------
  # KRaft Kafka (no zookeeper), mirroring the dev infra compose. Internal listener kafka:9092
  # (services use this), external localhost:9094 (host tooling). Core chat does NOT depend on
  # Kafka — only notification (a pure consumer) + the kafka-init one-shot gate on it.
  # TODO(prod-registry): `bitnamilegacy/*` is Bitnami's relocated namespace — revisit for a real
  # production registry / a maintained Kafka image before going live.
  kafka:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    restart: unless-stopped
    networks: [chatnet]
    # PHASE 1 = OFF: gated behind the "kafka" profile, so plain `up -d` does NOT start it. Enable with
    # `docker compose --profile kafka up -d` (+ set the publish flags true in .env).
    profiles: ["kafka"]
    # RAM cap on the box: the JVM heap is bounded (below) + a hard container limit as a backstop.
    mem_limit: 1g
    # Internal-only broker: services reach it at kafka:9092 over chatnet. NOT published to the host
    # (a prod broker shouldn't be host-exposed; also avoids clashing with the dev infra compose's
    # kafka on 9094). For host tooling, attach to chatnet or use `docker compose exec kafka`.
    expose: ["9092", "9094"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Cap the JVM heap for the 7.6GB box (Bitnami Kafka would otherwise grab a large default heap).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: create topics at their DECLARED partition counts (message.events.v1 = 6) BEFORE any
  # produce/consume, so :hash partitioning is stable. Relying on AUTO_CREATE would make them at
  # NUM_PARTITIONS=3. Waits for kafka healthy, creates from topics.env, then exits 0.
  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    networks: [chatnet]
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      TOPICS_FILE: "/topics.env"
    volumes:
      - ./infra/docker/kafka/create-topics.sh:/create-topics.sh:ro
      - ./infra/docker/kafka/topics.env:/topics.env:ro
    restart: "no"

  # notification_service — pure Kafka consumer (no HTTP API, no published port). Builds the
  # participant read-model from conversation.events.v1 and fans out one notification per recipient
  # from message.events.v1. Gates on kafka-init so the topics exist (correct partitions) before it
  # joins the groups (begin_offset: :latest → only events produced AFTER it joins).
  notification:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: notification_service, SERVICE_PORT: "4106"}
    restart: unless-stopped
    networks: [chatnet]
    profiles: ["kafka"]
    mem_limit: 384m
    volumes:
      - ./fcm-service-account.json:/app/fcm-service-account.json:ro
    environment:
      <<: *secrets
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      # Web-push sender (Phase 1). Empty keys = push disabled cleanly (fan-out rows still written).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@growblic.com}
      # Presence-aware suppression (Phase 3c): the gateway writes short-TTL "user viewing conversation"
      # markers to Redis; PushSender reads them to skip pushing to an active viewer. Fail-open — no/bad
      # Redis just means no suppression (pushes still send). Same Redis the gateway uses.
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_CONSUMER_ENABLED: "true"
      NOTIFICATION_PARTICIPANTS_CONSUMER_ENABLED: "true"
      NOTIFICATION_CALL_CONSUMER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # --- Media object storage (staged-in 2026-06-24) -------------------------------------------
  # MinIO (S3-compatible), internal-only: services reach it at minio:9000 over chatnet. NOT
  # published to the host (avoids clashing with the dev infra compose's minio on 9000/9001).
  # minio/minio is fine for prod parity (S3 API). The media service generates presigned URLs
  # against this endpoint/bucket; clients PUT/GET directly to MinIO.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [chatnet]
    mem_limit: 512m
    expose: ["9000", "9001"]
    # LOOPBACK-ONLY: the S3 API is bound to 127.0.0.1 so it is NOT publicly reachable. A local reverse
    # proxy (Caddy) fronts it for the browser (presigned PUT/GET) with TLS — see infra/caddy + runbook.
    # (For a quick pre-Caddy IP smoke test only, temporarily change to "9000:9000" and open the SG on
    # 9000, with MINIO_PUBLIC_ENDPOINT=http://<IP>:9000 — then revert once Caddy is up.)
    ports:
      - "127.0.0.1:9000:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the `chat-media` bucket (the dev compose does NOT) before media serves uploads.
  # Reuses the minio image (it bundles `mc`). Waits for minio healthy, makes the bucket, exits 0.
  minio-init:
    image: minio/minio:latest
    networks: [chatnet]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -c
      - 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/chat-media && mc ls local/'
    restart: "no"

  # Shared Redis — backs the /v1 runtime: rate-limit counter (INCR/EXPIRE) + idempotency KV (SET EX /
  # GET), so N gateway replicas enforce ONE combined limit and a replayed Idempotency-Key resolves on
  # any replica. Previously staged off; enabled now that /v1 is Redis-backed. appendonly for durability.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [chatnet]
    mem_limit: 256m
    # INTERNAL-ONLY: no host port — the gateway reaches it at redis:6379 over chatnet. Redis has no auth,
    # so it must never be host-published. maxmemory caps the dataset (rate-limit/idempotency is small);
    # allkeys-lru evicts under pressure rather than OOMing.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- ScyllaDB (Phase A) — CONTAINER + SCHEMA ONLY. The message store is STILL Postgres: this phase
  # does NOT touch MESSAGE_STORE_ADAPTER, adds NO driver, and NOTHING declares depends_on: scylla. With
  # the profile off (the default) a plain `up -d` is byte-identical to today. Bring up with:
  #   docker compose -f docker-compose.prod.yml --profile scylla up -d scylla
  # Then load the schema ONCE (the image has no /docker-entrypoint-initdb.d equivalent — see docs/scylla.md):
  #   docker compose -f docker-compose.prod.yml exec -T scylla cqlsh -f - < infra/docker/scylladb/init/001_chat_messages.cql
  #
  # MEMORY (the load-bearing part on this 7.6GB box with ~4.4GB free and 14 containers running): Scylla
  # DEFAULTS to claiming all available RAM and would OOM-kill the rest of the platform. Every flag below
  # is required, not decorative:
  #   --smp 1              ONE shard. Default is one per core, and each shard reserves its own memory
  #                        slice + threads — on a shared box that multiplies the footprint for no gain.
  #   --memory 1G          hard cap on Scylla's own (Seastar) allocation. Without it the default is
  #                        "everything free", which is exactly the OOM.
  #   --overprovisioned 1  tells Seastar it does NOT own the machine: no CPU pinning, no busy-poll spin,
  #                        no real-time scheduling assumptions. Correct for a container sharing 1 core.
  #   --reserve-memory 0   stop Scylla ALSO holding back headroom "for the OS" on top of --memory; with
  #                        both set it would otherwise reserve twice and overshoot the 1G budget.
  #   --developer-mode 1   REQUIRED here: skips the production disk/AIO checks (XFS, direct-IO depth)
  #                        that make Scylla refuse to boot on Docker's overlay filesystem.
  # mem_limit is a BACKSTOP above the 1G Seastar budget (non-Seastar RSS: JVM-less tooling, page cache
  # accounting) — same belt-and-braces as kafka's cap. If the container gets OOM-killed, raise this
  # before raising --memory.
  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    profiles: ["scylla"]
    networks: [chatnet]
    mem_limit: 1500m
    command:
      - --smp
      - "1"
      - --memory
      - "1G"
      - --overprovisioned
      - "1"
      - --reserve-memory
      - "0"
      - --developer-mode
      - "1"
    volumes:
      - scylla_data:/var/lib/scylla
    # INTERNAL only — reachable as scylla:9042 inside chatnet, never published to the host (postgres and
    # redis are the same). Phase B's driver connects over this network, not through the host.
    expose: ["9042"]
    # cqlsh proves the CQL port is actually SERVING (nodetool status only proves the node process is up,
    # which is weaker — the schema load and any future driver both speak CQL). start_period covers the
    # first-boot commitlog/system-keyspace initialisation, which is slow in developer mode.
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # --- Calling (Phase 1) — LiveKit SFU. OFF by default (profiles: ["calls"]); a plain `up -d` does NOT
  # start it and the running stack is unchanged. Bring up with `--profile calls up -d livekit`.
  #
  # BRIDGE networking (chatnet) so Caddy reaches the control port by SERVICE NAME (reverse_proxy
  # livekit:7880) — no host-net↔bridge isolation, no IPs. 7880 stays INTERNAL (Caddy fronts it; not in the
  # security group). Media/TURN are host-published as a SMALL set: all WebRTC media is muxed over a SINGLE
  # UDP port (rtc.udp_port 7882 in livekit.yaml), so we publish just one UDP media port instead of a
  # 10 000-port range — this avoids the docker-proxy large-range problem AND fixes reachability. LiveKit
  # advertises the EC2 public IP via rtc.node_ip (bridge can't STUN-detect it). Secrets via LIVEKIT_KEYS.
  livekit:
    # v1.9.0+ serves the /rtc/v1 signaling path that livekit-client 2.x (2.20) requests. v1.8.0 404s it
    # ("v1 RTC path not found") → the client falls back to legacy /rtc and CONNECTS, but the post-connect
    # mic-publish renegotiation then times out ("negotiation timed out") and audio drops at in-call. The
    # config schema is unchanged from 1.8 (rtc.udp_port/tcp_port/use_external_ip/node_ip, turn.* all valid).
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    profiles: ["calls"]
    networks: [chatnet]
    mem_limit: 256m
    command: --config /etc/livekit/livekit.yaml
    environment:
      # API key/secret pair (space after the colon, per LiveKit's LIVEKIT_KEYS format). From .env; kept
      # OUT of the mounted yaml so the config file carries no secret.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      # Caddy's data volume, READ-ONLY — LiveKit reads the turn.growblic.com cert Caddy provisioned here to
      # serve TURNS on 5349. The cert must EXIST at boot (deploy Caddy first; see the TURN block in the yaml).
      - caddy_data:/caddy-certs:ro
    # Start after Caddy so the cert dir is mounted. NOTE: depends_on only waits for Caddy to START, not for
    # the cert to be ISSUED — do the first TURN deploy staged (caddy → confirm cert file → livekit).
    depends_on:
      - caddy
    # Host-published media/TURN (OPEN these in the security group). 7880 is deliberately NOT published —
    # Caddy reaches it internally over chatnet as livekit:7880.
    ports:
      - "7881:7881"          # ICE/TCP fallback
      - "7882:7882/udp"      # WebRTC media (single UDP mux port) — carries the audio
      - "3478:3478/udp"      # built-in TURN (UDP)
      - "5349:5349"          # TURNS (TURN over TLS) — restrictive-firewall fallback

  gateway:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args: {RELEASE: gateway, SERVICE_PORT: "4000"}
    restart: unless-stopped
    networks: [chatnet]
    # Slightly higher cap than the domain services: bundles api_gateway + realtime_gateway (sockets).
    mem_limit: 512m
    environment:
      <<: *secrets
      PORT: "4000"
      # /v1 rate-limit ceiling (requests per app_id per 60s). The code default is 60 — a single-tenant
      # placeholder that cripples any real integrator (~3-6 concurrent active users). Interim raise while
      # the proper design lands (per-category buckets: auth/read/write; per-user sub-limits to stop one
      # client starving a tenant; X-RateLimit-* headers; sliding window). Affects ONLY /v1 — /api/v1 runs
      # on the `:api` pipeline, which has no rate-limit plug.
      CALL_PUSH_ENABLED: ${CALL_PUSH_ENABLED:-}
      KAFKA_PRODUCER_ADAPTER: brod
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      V1_RATE_LIMIT: "3000"
      # Allowed browser CORS origin(s), comma-separated. Read at runtime by the gateway endpoint
      # (cors_origins/0). Defaults to the local frontend dev server; override via .env for a real host.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Trustworthy realtime socket identity (verifies the bearer via auth over HTTP). Runtime-read
      # by realtime_gateway.UserSocket; matches fly.toml.
      REALTIME_AUTH_DB_BACKED: "true"
      # The gateway runs the edge controllers (users/me, conversations, messages, media) which branch
      # on these per-domain persistence flags IN THE GATEWAY PROCESS. Without them the controllers take
      # the placeholder branch (which lacks an else clause) and a client {:error,_} tuple becomes the
      # action return → Phoenix raises 500. fly.toml is a single all-in-one app so the flags sit on one
      # process; the split compose topology needs them on the gateway too. (MEDIA_DB_BACKED is also set
      # here though fly.toml omits it — a latent gap there; media's placeholder has an else so it 200s
      # but on the wrong path.)
      USER_PROFILE_DB_BACKED: "true"
      CONVERSATION_DB_BACKED: "true"
      MESSAGE_DB_BACKED: "true"
      MEDIA_DB_BACKED: "true"
      # Flip every client to HTTP + point at the service containers by name on the compose network.
      AUTH_CLIENT_ADAPTER: http
      AUTH_SERVICE_URL: http://auth:4101
      CONVERSATION_CLIENT_ADAPTER: http
      CONVERSATION_SERVICE_URL: http://conversation:4102
      USER_CLIENT_ADAPTER: http
      USER_SERVICE_URL: http://user:4103
      MESSAGE_CLIENT_ADAPTER: http
      MESSAGE_SERVICE_URL: http://message:4104
      MEDIA_CLIENT_ADAPTER: http
      MEDIA_SERVICE_URL: http://media:4105
      # Shared Redis backing the /v1 runtime (rate-limit counter + idempotency KV) so limits + dedupe
      # hold ACROSS gateway replicas. V1_RUNTIME_BACKEND defaults to redis; set explicitly for clarity.
      # On a Redis blip the runtime FAILS OPEN (allows the request) rather than 500-ing /v1.
      REDIS_URL: redis://redis:6379/0
      V1_RUNTIME_BACKEND: redis
      # LiveKit (Phase-1 calling): the gateway mints LiveKit access-token JWTs here. OPTIONAL — unset
      # leaves POST /api/v1/calls/token returning 503 (no boot failure). Same key/secret the livekit
      # container uses; URL is returned to the client. (Only the gateway needs these.)
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://livekit.growblic.com}
    # NOT host-published: Caddy is the only public edge and reaches the gateway at gateway:4000 over
    # chatnet. (expose is docs-only; the port is reachable on the network regardless.)
    expose: ["4000"]
    # Start order only (containers, not readiness — the release images have no curl for a
    # readiness probe). If the gateway calls a service before it's listening, the HTTP adapters
    # return {:error, :*_unavailable} → 503 (NOT a crash); it recovers once the service is up.
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      conversation:
        condition: service_started
      user:
        condition: service_started
      message:
        condition: service_started
      media:
        condition: service_started
      redis:
        condition: service_healthy

  # Next.js frontend — chat at / and admin at /admin in ONE app/container. Caddy routes BOTH
  # web.growblic.com and admin.growblic.com to web:3000 (see infra/caddy/Caddyfile). Not host-published.
  # NEXT_PUBLIC_* values are inlined into the JS bundle AT BUILD TIME → they are build args here, not
  # runtime env. Changing them requires `docker compose build web` again.
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.growblic.com}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-wss://api.growblic.com/socket}
        # PUBLIC key only — the private key must never reach any client build.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    networks: [chatnet]
    mem_limit: 512m
    expose: ["3000"]

  # Public edge — the ONLY host-published service. Mounts the domain/auto-HTTPS Caddyfile
  # (api/media/web/admin.growblic.com — matches what the server runs). For an IP-only HTTP bring-up,
  # temporarily mount ./infra/caddy/Caddyfile.http instead (:80 → gateway:4000, no TLS).
  # caddy_data persists the Let's Encrypt certs.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    networks: [chatnet]
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - web

networks:
  chatnet:
    driver: bridge

volumes:
  pgdata:
  scylla_data:
  kafka_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
